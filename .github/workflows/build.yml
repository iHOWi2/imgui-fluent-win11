name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Fetch Dear ImGui
        id: imgui
        run: git clone --depth 1 --branch v1.91.9 https://github.com/ocornut/imgui.git third_party/imgui

      - name: Android SDK packages
        id: sdk
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "ndk;26.1.10909125" "cmake;3.22.1" "platforms;android-34" 2>&1 | tee sdk.log

      - uses: gradle/actions/setup-gradle@v4
        id: setupgradle
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        id: build
        run: gradle --no-daemon assembleDebug 2>&1 | tee build.log

      - name: Publish release (latest)
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest app/build/outputs/apk/debug/app-debug.apk \
            --title "Latest build" --notes "Debug APK, landscape. Install and open Fluent ImGui."

      - name: Report failure as an issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Build failed for commit ${GITHUB_SHA}."
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo "Step outcomes: imgui=${{ steps.imgui.outcome }} sdk=${{ steps.sdk.outcome }} gradle-setup=${{ steps.setupgradle.outcome }} build=${{ steps.build.outcome }} release=${{ steps.release.outcome }}"
            echo
            echo "--- build.log errors ---"
            echo '```'
            grep -E "error:|Error|FAILED|undefined reference|What went wrong|CMake Error" build.log 2>/dev/null | head -60 || true
            echo '```'
            echo "--- build.log (tail) ---"
            echo '```'
            tail -n 60 build.log 2>/dev/null || echo "no build.log"
            echo '```'
          } > issue.md
          gh issue create --title "Build failed: ${GITHUB_SHA::7}" --body-file issue.md
