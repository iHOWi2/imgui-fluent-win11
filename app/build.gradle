plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.fluent.demo'
    compileSdk 34
    ndkVersion '26.1.10909125'

    defaultConfig {
        applicationId 'dev.fluent.demo'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
        ndk { abiFilters 'arm64-v8a' }
    }
    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }
}
