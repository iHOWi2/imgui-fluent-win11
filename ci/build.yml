# Move this file to .github/workflows/build.yml (GitHub UI: Add file > Create new file, paste).
# Pushing workflows needs a token with the 'workflow' scope, which the connected token lacks.
name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Fetch Dear ImGui
        run: git clone --depth 1 --branch v1.91.9 https://github.com/ocornut/imgui.git third_party/imgui

      - name: Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;26.1.10909125" "cmake;3.22.1" "platforms;android-34"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug 2>&1 | tee build.log

      - uses: actions/upload-artifact@v4
        with:
          name: fluent-imgui-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish release (latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest app/build/outputs/apk/debug/app-debug.apk \
            --title "Latest build" --notes "Debug APK, landscape. Install and open Fluent ImGui."

      - name: Report failure as an issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Build failed for commit ${GITHUB_SHA}."
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo '```'
            grep -E "error|Error|FAILED|undefined reference|What went wrong" build.log | head -60 || true
            echo '```'
          } > issue.md
          gh issue create --title "Build failed: ${GITHUB_SHA::7}" --label build-failure --body-file issue.md || \
          gh issue create --title "Build failed: ${GITHUB_SHA::7}" --body-file issue.md
